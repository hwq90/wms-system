<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>物料库导入模板</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
</head>
<body>
    <script>
        // 创建物料库模板Excel
        const wb = XLSX.utils.book_new();
        
        // 物料库sheet模板
        const productData = [
            ['物料编码', '物料名称', '规格型号', '单位', '分类', '供应商', '库存下限', '库存上限', '单价', '默认库位', '保质期(天)', '批次管理', '物料状态'],
            ['A001', '螺丝M6×20mm', '6mm×20mm', '盒', '五金', '某某公司', '10', '1000', '2.5', 'A-01-01', '365', '否', '正常'],
            ['A002', '螺母M6', 'M6', '盒', '五金', '某某公司', '20', '2000', '1.0', 'A-01-02', '365', '否', '正常'],
            ['B001', '轴承608', '608', '个', '轴承', '某某公司', '5', '500', '15.0', 'B-01-01', '730', '否', '正常'],
            ['C001', '润滑油', '500ml', '瓶', '辅料', '某某公司', '3', '50', '25.0', 'C-01-01', '180', '是', '正常']
        ];
        const ws1 = XLSX.utils.aoa_to_sheet(productData);
        XLSX.utils.book_append_sheet(wb, ws1, '物料库');
        
        // 库位模板
        const locationData = [
            ['库位编码', '仓库', '区域', '货架', '层数', '库位类型', '容量', '备注'],
            ['A-01-01', '1号仓', 'A区', '01架', '1层', '常用', '100, '五金区'],
            ['A-01-02', '1号仓', 'A区', '01架', '2层', '常用', '100, '五金区'],
            ['B-01-01', '1号仓', 'B区', '01架', '1层', '常用', '50, '轴承区'],
            ['C-01-01', '1号仓', 'C区', '01架', '1层', '危险品', '20, '化学品区']
        ];
        const ws2 = XLSX.utils.aoa_to_sheet(locationData);
        XLSX.utils.book_append_sheet(wb, ws2, '库位');
        
        // 下载模板
        XLSX.writeFile(wb, 'WMS导入模板.xlsx');
    </script>
</body>
</html>
