<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WMS导入模板生成器</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 500px; margin: 50px auto; }
        .card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); margin-bottom: 20px; }
        h1 { text-align: center; color: #333; margin-bottom: 10px; font-size: 24px; }
        .subtitle { text-align: center; color: #999; margin-bottom: 30px; }
        .btn { width: 100%; padding: 18px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; margin-bottom: 15px; transition: transform 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn-green { background: linear-gradient(135deg, #52c41a 0%, #73d13d 100%); }
        .btn-blue { background: linear-gradient(135deg, #1890ff 0%, #40a9ff 100%); }
        .info { background: #f5f5f5; padding: 15px; border-radius: 10px; margin-top: 20px; }
        .info h3 { color: #333; margin-bottom: 10px; font-size: 14px; }
        .info p { color: #666; font-size: 12px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📊 WMS模板生成器</h1>
            <p class="subtitle">点击按钮生成Excel导入模板</p>
            
            <button class="btn btn-green" onclick="generateProductTemplate()">🏷️ 生成物料库模板</button>
            <button class="btn btn-blue" onclick="generateLocationTemplate()">📍 生成库位模板</button>
            <button class="btn" onclick="generatePickTemplate()">🚚 生成领料清单模板</button>
            <button class="btn" onclick="generateAllTemplate()">📦 生成完整模板(含示例数据)</button>
            
            <div class="info">
                <h3>📝 使用说明</h3>
                <p>
                    1. 点击按钮生成Excel模板<br>
                    2. 用Excel/WPS打开下载的文件<br>
                    3. 按照格式填写你的数据<br>
                    4. 在WMS系统中导入该Excel文件
                </p>
            </div>
        </div>
    </div>

    <script>
        function generateProductTemplate() {
            const wb = XLSX.utils.book_new();
            const data = [
                ['物料编码', '物料名称', '规格型号', '单位', '分类', '供应商', '库存下限', '库存上限', '单价', '默认库位', '保质期(天)', '批次管理', '物料状态'],
                ['', '', '', '', '', '', '', '', '', '', '', '否', '正常']
            ];
            const ws = XLSX.utils.aoa_to_sheet(data);
            ws['!cols'] = [{wch:12},{wch:20},{wch:15},{wch:8},{wch:10},{wch:15},{wch:10},{wch:10},{wch:10},{wch:12},{wch:12},{wch:10},{wch:10}];
            XLSX.utils.book_append_sheet(wb, ws, '物料库');
            XLSX.writeFile(wb, '物料库导入模板.xlsx');
            alert('物料库模板已生成！');
        }

        function generateLocationTemplate() {
            const wb = XLSX.utils.book_new();
            const data = [
                ['库位编码', '仓库', '区域', '货架', '层数', '库位类型', '容量', '备注'],
                ['', '1号仓', '', '', '', '常用', '100', '']
            ];
            const ws = XLSX.utils.aoa_to_sheet(data);
            ws['!cols'] = [{wch:12},{wch:10},{wch:8},{wch:8},{wch:8},{wch:10},{wch:8},{wch:20}];
            XLSX.utils.book_append_sheet(wb, ws, '库位');
            XLSX.writeFile(wb, '库位导入模板.xlsx');
            alert('库位模板已生成！');
        }

        function generatePickTemplate() {
            const wb = XLSX.utils.book_new();
            const data = [
                ['物料编码', '物料名称', '领取数量', '库位'],
                ['', '', '', '']
            ];
            const ws = XLSX.utils.aoa_to_sheet(data);
            ws['!cols'] = [{wch:15},{wch:25},{wch:12},{wch:12}];
            XLSX.utils.book_append_sheet(wb, ws, '领料清单');
            XLSX.writeFile(wb, '领料清单模板.xlsx');
            alert('领料清单模板已生成！');
        }

        function generateAllTemplate() {
            const wb = XLSX.utils.book_new();
            
            // 物料库（含示例数据）
            const productData = [
                ['物料编码', '物料名称', '规格型号', '单位', '分类', '供应商', '库存下限', '库存上限', '单价', '默认库位', '保质期(天)', '批次管理', '物料状态'],
                ['A001', '螺丝M6×20mm', '6mm×20mm', '盒', '五金', '供应商A', 10, 1000, 2.5, 'A-01-01', 365, '否', '正常'],
                ['A002', '螺母M6', 'M6', '盒', '五金', '供应商A', 20, 2000, 1.0, 'A-01-02', 365, '否', '正常'],
                ['B001', '轴承608', '608', '个', '轴承', '供应商B', 5, 500, 15.0, 'B-01-01', 730, '否', '正常'],
                ['C001', '润滑油', '500ml', '瓶', '辅料', '供应商C', 3, 50, 25.0, 'C-01-01', 180, '是', '正常']
            ];
            const ws1 = XLSX.utils.aoa_to_sheet(productData);
            ws1['!cols'] = [{wch:12},{wch:20},{wch:15},{wch:8},{wch:10},{wch:15},{wch:10},{wch:10},{wch:10},{wch:12},{wch:12},{wch:10},{wch:10}];
            XLSX.utils.book_append_sheet(wb, ws1, '物料库');
            
            // 库位（含示例数据）
            const locationData = [
                ['库位编码', '仓库', '区域', '货架', '层数', '库位类型', '容量', '备注'],
                ['A-01-01', '1号仓', 'A区', '01架', '1层', '常用', 100, '五金区'],
                ['A-01-02', '1号仓', 'A区', '01架', '2层', '常用', 100, '五金区'],
                ['B-01-01', '1号仓', 'B区', '01架', '1层', '常用', 50, '轴承区'],
                ['C-01-01', '1号仓', 'C区', '01架', '1层', '危险品', 20, '化学品区']
            ];
            const ws2 = XLSX.utils.aoa_to_sheet(locationData);
            ws2['!cols'] = [{wch:12},{wch:10},{wch:8},{wch:8},{wch:8},{wch:10},{wch:8},{wch:20}];
            XLSX.utils.book_append_sheet(wb, ws2, '库位');
            
            // 领料清单（含示例数据）
            const pickData = [
                ['物料编码', '物料名称', '领取数量', '库位'],
                ['A001', '螺丝M6×20mm', 50, ''],
                ['A002', '螺母M6', 100, ''],
                ['B001', '轴承608', 20, '']
            ];
            const ws3 = XLSX.utils.aoa_to_sheet(pickData);
            ws3['!cols'] = [{wch:15},{wch:25},{wch:12},{wch:12}];
            XLSX.utils.book_append_sheet(wb, ws3, '领料清单');
            
            XLSX.writeFile(wb, 'WMS完整导入模板.xlsx');
            alert('完整模板已生成！包含示例数据');
        }
    </script>
</body>
</html>
